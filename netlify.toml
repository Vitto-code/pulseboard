# Deploy do pulseboard no Netlify.
# O banco PostgreSQL precisa estar hospedado (Neon, Supabase, Railway...)
# e a variavel DATABASE_URL configurada no painel do site.

[build]
  # aplica as migracoes no banco de producao antes de compilar
  command = "npm run db:migrate && npm run build"

[build.environment]
  NODE_VERSION = "20"

# Runtime oficial do Next.js no Netlify (App Router, Server Actions,
# middleware e revalidacao sao suportados por ele).
[[plugins]]
  package = "@netlify/plugin-nextjs"
