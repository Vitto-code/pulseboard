name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # O build nao conecta no banco (paginas dinamicas); a URL so e
      # exigida pelo Prisma Client em tempo de geracao.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint + tsc)
        run: npm run lint

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
